services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-tutorial-app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: tutorial
      DB_PASSWORD: tutorial
      DB_NAME: go_tutorial
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    command: ["air", "-c", ".air.toml"]

  db:
    image: mysql:8.4
    container_name: go-tutorial-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: go_tutorial
      MYSQL_USER: tutorial
      MYSQL_PASSWORD: tutorial
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
